name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download pinned FFmpeg build for reference upload tests
        shell: pwsh
        run: |
          $downloadUrl = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-essentials_build.zip"
          $expectedSha256 = "DB580001CAA24AC104C8CB856CD113A87B0A443F7BDF47D8C12B1D740584A2EC"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
          $actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "FFmpeg archive checksum mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          New-Item -ItemType Directory -Force -Path "vendor/ffmpeg" | Out-Null
          $ffmpeg = Get-ChildItem $expanded -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem $expanded -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          $license = Get-ChildItem $expanded -Recurse -Filter "LICENSE" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe -or -not $license) {
            throw "Pinned FFmpeg package does not contain the expected files"
          }
          Copy-Item $ffmpeg.FullName "vendor/ffmpeg/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "vendor/ffmpeg/ffprobe.exe"
          Copy-Item $license.FullName "vendor/ffmpeg/LICENSE"

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Verify MCP reconnect after desktop restart
        run: npm run test:mcp

